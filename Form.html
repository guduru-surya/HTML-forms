<marquee behavior="" direction="right">
  <center><h1>Course Registration Form</h1></center>
</marquee>

<form action="response.html" autocomplete="">
  <fieldset>
    <legend>Personal details</legend>
    <table>
      <tr>
        <td><label for="name">First Name</label></td>
        <td>
          <input
            type="text"
            required
            name="first_name"
            id=""
            placeholder="Ex:Surya"
          /><br />
        </td>
      </tr>
      <tr>
        <td><label for="">SurName</label></td>
        <td><input type="text" name="sur_name" /><br /></td>
      </tr>
      <tr>
        <td><label for="Mobile Number">Mobile Number</label></td>
        <td><input type="tel" required name="Moble Number" /><br /></td>
      </tr>
      <tr>
        <td><label for="">Email</label></td>
        <td><input type="email" required name="email" /><br /></td>
      </tr>
      <tr>
        <td><label for="">Password</label></td>
        <td>
          <input type="password" required name="password" minlength="8" /><br />
        </td>
      </tr>
      <tr>
        <td><label for="">Confirm Password</label></td>
        <td><input type="password" required name="cpassword" id="" /><br /></td>
      </tr>
      <tr>
        <td><label for="">DOB</label></td>
        <td><input type="date" required name="dob" id="" /><br /></td>
      </tr>
      <tr>
        <td><label for="">Gender</label></td>
        <td>
          <input type="radio" name="gender" id="" value="M" />MALE
          <input type="radio" name="gender" id="" value="F" />FEMALE
          <input type="radio" name="gender" id="" value="O" />OTHERS<br />
        </td>
      </tr>
      <tr>
        <td><label for="">Select Country</label></td>
        <td>
          <select name="country" required id="">
            <option value="sel">Select</option>
            <option value="IND">INDIA</option>
            <option value="GER">GERMANY</option>
            <option value="usa">USA</option>
            <option value="us">US</option>
            <option value="fRN">FRANCE</option>
            <option value="SA">SOUTH AFRICA</option>
            <option value="NZ">NEW ZELAND</option>
            <option value="AUS">AUSTRALIA</option></select
          ><br />
        </td>
      </tr>
      <tr>
        <td><lable for="">Upload Picture</lable></td>
        <td><input type="file" required name="pic" id="" /><br /></td>
      </tr>
      <tr>
        <td><input type="reset" /></td>
      </tr>
      <tr>
        <td></td>
      </tr>
    </table>
  </fieldset>

  <fieldset>
    <legend>Course details</legend>
    <label for="">Select Course</label><br />
    <select name="" required>
      <option value="">Python Full Stack</option>
      <option value="">JAVA Full Stack</option></select
    ><br />
    <label for="">Delivery mode</label>
    <input type="radio" name="Course" />Online
    <input type="radio" name="Course" />Offline<br />
    <label for="">Comments</label><br />
    <textarea name="" id="" cols="40" rows="5"></textarea><br />
    <input type="submit" />
  </fieldset>
</form>

<button>
  <a href="Documents/Guduru_Surya_Resume.pdf" download="">Click Here</a>
</button>
